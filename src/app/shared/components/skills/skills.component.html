<section class="skill" id="skills" data-aos="fade-right">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="headers skill-head">
          <h2>My <span>Skills</span></h2>
          <p>Here is my skills to represent my Expertise</p>
        </div>
      </div>
    </div>

    <!-- Technical Skills -->
    <div class="row">
      <div class="col-12 mb-5">
        <div class="experience-details-container">
          <div class="about-containers">
            <div class="details-container">
              <h2 class="experience-sub-title">Technical Skills</h2>
              <div class="article-container">
                <ng-container *ngFor="let skill of technicalSkills">
                  <article>
                    <img
                      [src]="iconUrl"
                      alt="Experience-icon"
                      title="Experience-icon"
                      class="icon"
                    />
                    <div>
                      <h3>{{ skill }}</h3>
                    </div>
                  </article>
                </ng-container>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Professional Skills -->
      <div class="col-12">
        <div class="experience-details-container">
          <h2 class="experience-sub-title">Professional Skills</h2>
          <div class="article-container">
            <ng-container *ngFor="let skill of professionalSkills">
              <article>
                <img
                  [src]="iconUrl"
                  alt="Experience-icon"
                  title="Experience-icon"
                  class="icon"
                />
                <div>
                  <h3>{{ skill }}</h3>
                </div>
              </article>
            </ng-container>
          </div>
        </div>
      <div class="parent-container">
        <!-- <a class="contactBtn" routerLink="/contact" mat-raised-button color="primary" fragment="contact">Contact Me</a> -->
        <a class="contactBtn" routerLink="/contact" mat-raised-button color="primary">Contact Me</a>
         <!-- <a class="contactBtn" routerLink="/contact" mat-raised-button color="primary">
          Contact Me
        </a> -->
        
    </div>
    </div>
    </div>
   </div>
</section>
