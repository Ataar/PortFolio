<section class="contact" id="contact">
  <div class="container">
    <div class="row">
      <div class="col-12 mb-5">
        <div class="content text-center text-white">
          <!-- <h2>Contact Me</h2>
          <p class="pt-3">Let's Connect and Create Something Amazing Together!</p> -->
          <h2 #contactHeading>Contact Me</h2>
          <p class="pt-3">Let's Connect and Create Something Amazing Together!</p>
        </div>
      </div>

      <div class="col-12 col-md-6" data-aos="fade-right">
        <div class="contactInfo">
          <div class="boxx" *ngFor="let contact of contactDetails">
            <div class="icon">
              <i [class]="contact.icon"></i>
            </div>
            <div class="text">
              <h3>{{ contact.label }}</h3>
              <p *ngIf="!contact.isLink">{{ contact.value }}</p>
              <p *ngIf="contact.isLink">
                <a [href]="contact.href" target="_blank">{{ contact.value }}</a>
              </p>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6" data-aos="fade-right">
        <div class="contactform">
         <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
        <h2>Send Message</h2>

  <div class="form-group">
    <label for="fullname">Name</label>
  
     <!-- #nameInput is called a template reference variable in Angular.
     Ye HTML ke kisi bhi element ko ek local naam (reference) deta hai.
     Aap is naam se us element ko Angular ke TypeScript file me ViewChild ke through access kar sakte ho. -->
    <input type = 'text' id="fullname" #nameInput  (input)="focusEmail()" formControlName="fullname" class="form-control" required />
    <div *ngIf="contactForm.get('fullname')?.invalid && contactForm.get('fullname')?.touched" class="text-danger">
      Fullname is required
    </div>
  </div>

  <div class="form-group">
    <label for="email">Email</label>
    <input id="email"  #emailInput (input)="focusMessage()"formControlName="email" class="form-control" required />
    <div *ngIf="contactForm.get('email')?.invalid && contactForm.get('email')?.touched" class="text-danger">
      Enter a valid email
    </div>
  </div>

  <div class="form-group">
    <label for="message">Feedback</label>
    <textarea id="message" #messageInput formControlName="message" rows="4" class="form-control"></textarea>
    <div *ngIf="contactForm.get('message')?.invalid && contactForm.get('message')?.touched" class="text-danger">
      Message is required
    </div>
  </div>

  <div class="form-group">
   <!-- FIX: Remove 'btn' -->
<button mat-raised-button color="primary" type="submit" [disabled]="contactForm.invalid">
  Send
</button>

  </div>
</form>

        </div>
      </div>
    </div>
  </div>
</section>
